{% extends "base.html" %}

{% block title %}{% if mode == "edit" %}메모 수정{% else %}새 메모 작성{% endif %}{% endblock %}

{% block content %}
<h1>{% if mode == "edit" %}메모 수정{% else %}새 메모 작성{% endif %}</h1>

{% if error %}
<p style="color: red;">{{ error }}</p>
{% endif %}

<form method="post" action="{{ action }}">
    <div>
        <label for="title">제목</label><br>
        <input
            type="text"
            id="title"
            name="title"
            value="{{ memo.title if memo else '' }}"
        >
    </div>

    <div style="margin-top: 12px;">
        <label for="content">내용</label><br>
        <textarea
            id="content"
            name="content"
            rows="10"
            cols="60"
        >{{ memo.content if memo else '' }}</textarea>
    </div>

    <div style="margin-top: 12px;">
        <button type="submit">저장</button>
        <a href="/memos">취소</a>
    </div>
</form>
{% endblock %}
