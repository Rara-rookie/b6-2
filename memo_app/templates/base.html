<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}메모 앱{% endblock %}</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 16px;
            line-height: 1.6;
            color: #222;
        }
        header, footer {
            margin-bottom: 24px;
        }
        nav a {
            margin-right: 12px;
        }
        .error {
            color: #b00020;
            font-weight: bold;
        }
        form {
            margin: 16px 0;
        }
        input[type="text"], textarea {
            width: 100%;
            max-width: 100%;
            box-sizing: border-box;
            padding: 8px;
        }
        textarea {
            min-height: 180px;
        }
        .actions {
            margin-top: 16px;
        }
        .actions a,
        .actions button {
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <header>
        <h1><a href="/" style="text-decoration: none; color: inherit;">메모 앱</a></h1>
        <nav>
            <a href="/memos">메모 목록 보기</a>
            <a href="/memos/new">새 메모 작성</a>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <small>FastAPI와 SQLAlchemy로 만든 게시판형 메모 서비스</small>
    </footer>
</body>
</html>
